<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EDE4">
<title>Sem conexão · Carta para o meu amor</title>
<link rel="icon" href="/icons/favicon-32-v2.png">
<style>
  html,body{margin:0;min-height:100%;background:#F6EDE4;color:#1A1410;font-family:Figtree,system-ui,-apple-system,sans-serif}
  main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.4rem;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:2.2rem;line-height:1.1;margin:1.2rem 0 .6rem}
  p{color:#6B5B52;max-width:22rem;line-height:1.55;margin:0 auto}
  button{margin-top:1.6rem;min-height:3rem;border:0;border-radius:999px;background:#E85A7A;color:#FBF6F0;padding:0 1.6rem;font:inherit;font-weight:600;box-shadow:0 14px 30px rgb(232 90 122/.28)}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192-v2.png" alt="">
  <h1>Sem conexão por aqui.</h1>
  <p>O mensageiro espera o sinal voltar. Assim que a internet voltar, a sua carta continua de onde parou.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
<script>addEventListener("online",()=>location.reload())</script>
</body>
</html>
